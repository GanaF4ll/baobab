<div
  (click)="onSelect()"
  class="border rounded-lg p-lg flex flex-col group transition-all duration-200 cursor-pointer relative overflow-hidden h-full min-h-[220px] hover:border-primary hover:bg-surface-container hover:shadow-crisp"
>
  <!-- Header: Icon & Actions -->
  <div class="flex justify-between items-start mb-md">
    <div class="w-10 h-10 rounded flex items-center justify-center">
      <span class="material-symbols-outlined">{{ icon }}</span>
    </div>
    <div class="flex gap-xs" (click)="$event.stopPropagation()">
      <span
        class="material-symbols-outlined text-on-surface opacity-40 text-[18px] cursor-pointer hover:opacity-100"
      >
        more_vert
      </span>
    </div>
  </div>

  <!-- Title & Description -->
  <h3 class="font-headline-md text-headline-md mb-xs text-on-surface">{{ workspace.name }}</h3>
  <p class="font-body-md text-body-md text-on-surface opacity-70 mb-lg line-clamp-2">
    {{ workspace.description }}
  </p>

  <!-- Progress and Info -->
  <div class="mt-auto space-y-md">
    <div class="flex items-center justify-between border-t border-outline-variant pt-md">
      <div class="flex items-center gap-xs">
        <span class="material-symbols-outlined text-[16px] text-on-surface opacity-60"
          >description</span
        >
        <span class="font-label-technical text-label-technical text-on-surface opacity-60"
          >{{ workspace.documentCount }}
          Docs</span
        >
      </div>
      <span class="font-label-technical text-label-technical text-on-surface opacity-60"
        >{{ workspace.createdAt| date: 'dd MMMM, yyyy' }}</span
      >
    </div>
  </div>
</div>
