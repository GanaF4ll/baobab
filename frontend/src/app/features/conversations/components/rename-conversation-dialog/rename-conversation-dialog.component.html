<div class="space-y-md">
  <hlm-dialog-header>
    <h3 hlmDialogTitle class="text-headline-md font-bold text-on-surface">Renommer cette conversation</h3>
  </hlm-dialog-header>

  <form (submit)="submit(); $event.preventDefault()" class="space-y-lg pt-sm">
    <!-- Conversation Title Input -->
    <div class="space-y-sm">
      <input
        hlmInput
        type="text"
        name="title"
        [value]="model().title"
        (input)="onTitleInput($any($event.target).value)"
        placeholder="Titre de la conversation"
        class="w-full bg-surface-container-lowest border rounded px-md py-sm text-body-md text-on-surface transition-colors"
        [class.border-error]="renameForm.title().invalid() && (renameForm.title().dirty() || renameForm.title().touched())"
        [class.border-outline-variant]="!(renameForm.title().invalid() && (renameForm.title().dirty() || renameForm.title().touched()))"
        autocomplete="off"
      >
      @if (renameForm.title().invalid() && (renameForm.title().dirty() || renameForm.title().touched())) {
        <p class="text-[12px] text-error">Le titre de la conversation est obligatoire.</p>
      }
    </div>

    <!-- Action Buttons -->
    <hlm-dialog-footer
      class="flex flex-col-reverse sm:flex-row justify-end gap-sm pt-md border-t border-outline-variant"
    >
      <button
        hlmBtn
        variant="ghost"
        type="button"
        (click)="cancel()"
        class="border border-outline-variant text-on-surface hover:bg-surface-container-high font-semibold py-1.5 px-4 cursor-pointer"
      >
        Annuler
      </button>
      <button
        hlmBtn
        type="submit"
        [disabled]="renameForm().invalid()"
        class="bg-primary text-on-primary hover:opacity-90 font-semibold py-1.5 px-4 cursor-pointer disabled:opacity-50"
      >
        Renommer
      </button>
    </hlm-dialog-footer>
  </form>
</div>
