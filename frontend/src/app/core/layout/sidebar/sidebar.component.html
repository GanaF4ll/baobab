<aside
  [class.w-64]="isOpen()"
  [class.w-0]="!isOpen()"
  [class.border-r]="isOpen()"
  class="fixed inset-y-0 left-0 bg-surface-container-low border-outline-variant flex flex-col z-50 transition-all duration-300 ease-in-out overflow-hidden"
>
  <div class="w-64 h-full flex flex-col py-md gap-sm">
    <!-- Brand logo/heading -->
    <div class="px-lg mb-sm">
      <div class="flex items-center gap-sm">
        <div class="w-8 h-8 rounded bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[20px]">psychology</span>
        </div>
        <div>
          <h1 class="font-headline-md text-headline-md font-bold text-on-surface">Baobab AI</h1>
          <p class="font-label-technical text-label-technical text-on-surface opacity-70">Privacy-First RAG</p>
        </div>
      </div>
    </div>

    @if (inWorkspace()) {
      <!-- Workspace Header Context -->
      <div class="px-lg py-sm mb-xs border-b border-outline-variant bg-surface-container-high/40 rounded-lg mx-sm">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-xs min-w-0">
            <span class="material-symbols-outlined text-primary text-[18px] flex-shrink-0">workspaces</span>
            <span class="font-label-technical text-label-technical font-bold text-on-surface truncate">
              {{ activeWorkspace()?.name || 'Workspace' }}
            </span>
          </div>
          <a routerLink="/" class="text-xs text-primary hover:underline font-medium flex-shrink-0 flex items-center gap-0.5">
            <span class="material-symbols-outlined text-[12px]">arrow_back</span>
            Change
          </a>
        </div>
      </div>

      <!-- Navigation items for Workspace View -->
      <nav class="flex-1 px-sm space-y-1">
        <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">forum</span>
          <span class="font-label-technical text-label-technical">Conversations</span>
        </a>
        <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">database</span>
          <span class="font-label-technical text-label-technical">Documents</span>
        </a>
        <!-- <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">history</span>
          <span class="font-label-technical text-label-technical">History</span>
        </a> -->
        <!-- <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-label-technical text-label-technical">Workspace Settings</span>
        </a>
        <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">help_center</span>
          <span class="font-label-technical text-label-technical">Support</span>
        </a> -->
      </nav>

      <!-- Upload Document Button -->
      <div class="px-md mt-auto">
        <button
          hlmBtn
          (click)="onUpload()"
          class="w-full py-sm bg-secondary-container text-on-secondary-fixed rounded font-label-technical text-label-technical font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-xs shadow-sm cursor-pointer"
        >
          <span class="material-symbols-outlined text-[18px]">upload_file</span>
          Upload Document
        </button>
      </div>
    } @else {
      <!-- Navigation items for Workspaces List View -->
      <nav class="flex-1 px-sm space-y-1">
        <a
          routerLink="/"
          routerLinkActive="bg-surface-container text-primary font-bold border-r-2 border-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">workspaces</span>
          <span class="font-label-technical text-label-technical">Workspaces</span>
        </a>
        <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-label-technical text-label-technical">Global Settings</span>
        </a>
        <a
          href="#"
          (click)="$event.preventDefault()"
          class="flex items-center gap-md px-md py-sm transition-colors duration-200 hover:bg-surface-container group text-on-surface opacity-80 font-medium"
        >
          <span class="material-symbols-outlined text-[20px]">help_center</span>
          <span class="font-label-technical text-label-technical">Support</span>
        </a>
      </nav>

      <!-- Create Workspace Button -->
      <div class="px-md mt-auto">
        <button
          hlmBtn
          (click)="onUpload()"
          class="w-full py-sm bg-secondary-container text-on-secondary-fixed rounded font-label-technical text-label-technical font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-xs shadow-sm cursor-pointer"
        >
          <span class="material-symbols-outlined text-[18px]">add</span>
          New Workspace
        </button>
      </div>
    }
  </div>
</aside>
