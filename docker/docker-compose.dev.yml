services:
  baobab-db:
    image: pgvector/pgvector:pg16
    container_name: baobab-db
    restart: always
    ports:
      - '5432:5432'
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_USER: ${DB_USER:-baobab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baobab}
      POSTGRES_DB: ${DB_NAME:-baobab_db}
      TZ: ${TZ:-Europe/Paris}
      POSTGRES_LOG_STATEMENT: all
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baobab} -d ${DB_NAME:-baobab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baobab-network

  baobab-storage:
    image: minio/minio:latest
    container_name: baobab-storage
    restart: always
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    env_file:
      - ../.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Europe/Paris}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baobab-network

  baobab-ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: baobab-ollama
    restart: always
    ports:
      - '11434:11434'
    env_file:
      - ../.env.dev
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - baobab-network

  baobab-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: baobab-backend
    restart: on-failure
    ports:
      - '2400:2400'
    env_file:
      - ../.env.dev
    volumes:
      - ../backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      baobab-db:
        condition: service_healthy
      baobab-storage:
        condition: service_healthy
      baobab-ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2400/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - baobab-network

  baobab-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: baobab-frontend
    restart: on-failure
    ports:
      - '3000:3000'
    env_file:
      - ../.env.dev
    environment:
      NODE_ENV: development
      TZ: ${TZ:-Europe/Paris}
      API_URL: http://localhost:2400
    volumes:
      - ../frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      baobab-backend:
        condition: service_healthy
    networks:
      - baobab-network

networks:
  baobab-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  ollama-data:
