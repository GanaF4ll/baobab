services:
  baobab-db:
    image: pgvector/pgvector:pg16
    container_name: baobab-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER:-baobab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baobab}
      POSTGRES_DB: ${DB_NAME:-baobab_db}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baobab} -d ${DB_NAME:-baobab_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baobab-network

  baobab-storage:
    image: minio/minio:latest
    container_name: baobab-storage
    restart: unless-stopped
    ports:
      - '${MINIO_PORT:-9000}:9000'         # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Web Console
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Europe/Paris}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baobab-network

  baobab-ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: baobab-ollama
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    env_file:
      - ../.env
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - baobab-network

  baobab-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.prod
    container_name: baobab-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-2400}:2400'
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 2400
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${DB_USER:-baobab}:${DB_PASSWORD:-baobab}@baobab-db:5432/${DB_NAME:-baobab_db}
      MINIO_ENDPOINT: http://baobab-storage:9000
    depends_on:
      baobab-db:
        condition: service_healthy
      baobab-storage:
        condition: service_healthy
      baobab-ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2400/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - baobab-network

  baobab-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.prod
    container_name: baobab-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      baobab-backend:
        condition: service_healthy
    networks:
      - baobab-network

networks:
  baobab-network:
    name: baobab-network
    driver: bridge

volumes:
  postgres-data:
    name: baobab-postgres-data
  minio-data:
    name: baobab-minio-data
  ollama-data:
    name: baobab-ollama-data
