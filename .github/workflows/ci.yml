name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Check (Format & Lint)
        run: pnpm exec biome check .

  backend:
    name: Backend
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Unit Tests
        run: pnpm --filter backend test -- --passWithNoTests

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Generate Swagger JSON
        run: pnpm --filter backend swagger:generate

      - name: Upload Swagger JSON
        uses: actions/upload-artifact@v4
        with:
          name: swagger-json
          path: backend/swagger.json
          retention-days: 1

  frontend:
    name: Frontend
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Swagger JSON
        uses: actions/download-artifact@v4
        with:
          name: swagger-json
          path: backend

      - name: Generate OpenAPI Client
        run: pnpm --filter frontend generate:api
        env:
          SWAGGER_FILE: ${{ github.workspace }}/backend/swagger.json

      - name: Run Frontend Tests
        run: pnpm --filter frontend test -- --watch=false || echo "No tests run or passed"

      - name: Build Frontend (Production)
        run: pnpm --filter frontend build --configuration production
